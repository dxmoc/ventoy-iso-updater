name: release

# Builds the binaries for a published release and attaches them to it. The
# release itself (tag + notes) is still created by hand. Pull requests that
# touch the build only build, so a broken target shows up before a release.

on:
  release:
    types: [published]
  pull_request:
    paths: [".github/workflows/release.yml", "Cargo.toml", "Cargo.lock"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  asset: ventoy-iso-updater-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: ventoy-iso-updater-linux-arm64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     asset: ventoy-iso-updater-windows-x86_64.exe }
          - { os: macos-latest,     target: aarch64-apple-darwin,       asset: ventoy-iso-updater-macos-arm64 }
          - { os: macos-latest,     target: x86_64-apple-darwin,        asset: ventoy-iso-updater-macos-x86_64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Upload
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=target/${{ matrix.target }}/release/ventoy-iso-updater
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "${{ matrix.asset }}"
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber

  checksums:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p 'ventoy-iso-updater-*'
          sha256sum ventoy-iso-updater-* > SHA256SUMS
          gh release upload "$TAG" SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber

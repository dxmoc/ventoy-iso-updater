name: checks

# Two different failure modes, so two jobs.
#
# The catalog resolves download URLs from ~50 foreign directory listings, and
# upstream drift is what breaks it -- that needs the network and only needs
# checking once, so it runs on Linux alone.
#
# Drive detection and the ventoy.json rewriting are where the platforms
# actually differ: Win32 API, /sys, or /Volumes depending on where they run,
# and a case-insensitive filesystem underneath. Those run everywhere the script
# claims to support, offline.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  platform:
    name: platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest moved to 26.04, which has no Python 3.9 build.
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The script targets 3.6+, but the runners no longer ship anything
          # below 3.9. This still catches syntax and stdlib usage newer than
          # 3.9; the 3.6-3.8 window is untested.
          python-version: "3.9"

      - name: Compile
        run: python -m compileall -q update_ventoy_isos.py tests/

      - name: Drive detection and ventoy.json handling
        run: python tests/check_platform.py

  resolvers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Resolve every catalog entry
        # Runners share outbound IPs, so the 60/hour anonymous GitHub API
        # budget is often already spent by the time this job starts. The
        # script picks the token up from the environment.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tests/check_resolvers.py

name: checks

# Two different failure modes, so two jobs.
#
# The catalog resolves download URLs from ~50 foreign directory listings, and
# upstream drift is what breaks it -- that needs the network and only needs
# checking once, so it runs on Linux alone.
#
# Drive detection and the ventoy.json rewriting are where the platforms
# actually differ: Win32 API, /sys, or /Volumes depending on where they run,
# and a case-insensitive filesystem underneath. Those unit tests run everywhere
# the program claims to support, offline.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  platform:
    name: platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy rustfmt
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Offline tests
        run: cargo test --locked

  resolvers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Resolve every catalog entry
        # Runners share outbound IPs, so the 60/hour anonymous GitHub API
        # budget is often already spent by the time this job starts. The
        # program picks the token up from the environment.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test --locked --test resolvers -- --ignored --nocapture
